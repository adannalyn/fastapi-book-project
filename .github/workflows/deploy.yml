name: Deploy FastAPI to EC2

on:
  push:
    branches:
      - feature/AmazingFeature  # Trigger on pushes to this branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key 🔑
        run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.ACTIONS_DEPLOY_KEY }}" | base64 --decode > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_rsa
      
      
      - name: Debug SSH Directory 🛠
        run: ls -la ~/.ssh        
      

      - name: Deploy to EC2 🚀
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          
          echo "✅ Connected to EC2 instance!"

          # Navigate to project directory
          cd ~/fastapi-book-project

          # Pull latest changes from GitHub
          git pull origin feature/AmazingFeature

          # Install dependencies
          pip install -r requirements.txt

          # Restart FastAPI (Uvicorn)
          pkill -f "uvicorn" || true
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 --reload &

          # Restart Nginx
          sudo systemctl restart nginx

          echo "🚀 Deployment successful!"
          EOF
