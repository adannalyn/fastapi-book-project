name: Deploy FastAPI App

on:
  push:
    branches:
      - feature/AmazingFeature

jobs:
  deploy:
    name: Deploy FastAPI to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            echo "Connected to EC2 instance!"

            # Navigate to project directory
            cd ~/fastapi-book-project

            # Authenticate GitHub with access token
            git remote set-url origin https://x-access-token:${{ secrets.GH_ACCESS_TOKEN }}@github.com/adannalyn/fastapi-book-project.git
            
            # Pull latest changes
            git pull origin feature/AmazingFeature

            # Install dependencies if needed
            pip install -r requirements.txt

            # Restart FastAPI
            pkill -f "uvicorn" || true
            nohup uvicorn main:app --host 0.0.0.0 --port 8000 --reload &

            # Restart Nginx
            sudo systemctl restart nginx

            echo "Deployment successful! 🚀"
          EOF
