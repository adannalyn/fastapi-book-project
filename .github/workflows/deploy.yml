name: Deploy FastAPI to EC2

on:
  push:
    branches:
      - feature/AmazingFeature
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key from File 🔑
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp deploy_key.pem ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Debug SSH Connection 🛠
        run: ssh -o StrictHostKeyChecking=no ubuntu@16.170.208.2 "echo '✅ Connected to EC2 instance!'"

      - name: Deploy to EC2 🚀
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@your-ec2-ip << 'EOF'
          echo "✅ Connected to EC2!"
          cd ~/fastapi-book-project
          git pull origin feature/AmazingFeature
          pip install -r requirements.txt
          pkill -f "uvicorn" || true
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 --reload &
          sudo systemctl restart nginx
          echo "🚀 Deployment successful!"
          EOF
